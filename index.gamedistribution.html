<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0604" />
    <title>7Bust: hit the felt</title>

    <!-- Fonts are bundled since the game runs in other sites' frames, where a CDN font can be blocked -->
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <!-- The shared server every platform uses, so all players share the same rooms -->
    <!-- It runs on other sites in a frame, websockets to our server still work from there -->
    <script>
      window.__WS_BACKEND__ = "wss://7-bust-cg.vercel.app/api/ws";

      // The GameDistribution game id
      // Having it set is how the game knows it's running on GameDistribution
      window.__GD_GAME_ID__ = "REPLACE_WITH_GD_GAME_ID";

      // Must exist before their SDK loads, it can say it's ready before our code is set up
      // So events wait in this list until our handler takes them
      window.__gdEvents = [];
      window.GD_OPTIONS = {
        gameId: window.__GD_GAME_ID__,
        advertisementSettings: { debug: false, autoplay: false },
        onEvent: function (event) {
          if (window.__gdHandler) window.__gdHandler(event);
          else window.__gdEvents.push(event);
        },
      };
    </script>

    <!-- Their ad SDK, it has to load from their site -->
    <!-- Loaded early so an ad can get ready. Off their site, or with an ad blocker, every ad just fails -->
    <script src="https://html5.api.gamedistribution.com/main.min.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <!-- Big announcements like "Bust" and "Clean 7" sit outside the app so redraws never cut them off -->
    <!-- The id has to be announce, that's what the code looks for -->
    <div id="announce" aria-hidden="true"></div>
    <noscript>7Bust needs JavaScript enabled.</noscript>
    <!-- Runs the real modules here, the build swaps in the bundled game.js -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
