<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0604" />
    <title>7Bust: hit the felt</title>

    <!-- Fonts are bundled, Discord blocks outside requests so a CDN font would quietly fall back -->
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <!-- The shared server every platform uses, so all players share the same rooms -->
    <!-- Discord blocks it, so their SDK sends it through their proxy while the game runs -->
    <script>
      window.__WS_BACKEND__ = "wss://7-bust-cg.vercel.app/api/ws";

      // The Activity's app id from the Discord developer portal
      // Having it set is how the game knows it's running in Discord
      window.__DISCORD_CLIENT_ID__ = "REPLACE_WITH_DISCORD_APPLICATION_ID";
    </script>

    <!-- The Discord SDK, bundled since Discord blocks outside requests -->
    <script src="./discord-sdk.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <!-- Big announcements like "Bust" and "Clean 7" sit outside the app so redraws never cut them off -->
    <div id="slam" aria-hidden="true"></div>
    <!-- Runs the real modules here, the build swaps in the bundled game.js -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
