<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0604" />
    <title>7Bust: hit the felt</title>

    <!-- Fonts are bundled, CrazyGames hosts the files and may block outside requests -->
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <!-- Every platform build uses this same server so all players share one set of rooms -->
    <!-- A room code from one platform works on another. vercel.app and localhost use their own -->
    <script>
      window.__WS_BACKEND__ = "wss://7-bust-cg.vercel.app/api/ws";
    </script>

    <!-- CrazyGames SDK, loaded before the game so it's there at boot. Its methods throw off their site -->
    <!-- Has to be v3, the old v2 still loads but quietly has no mute, room state or cloud saves -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!-- Sends every uncaught error to the server, last in head so it's ready before the game runs -->
    <!-- Players never see it, the on screen box only shows with debug=1 in the URL -->
    <script>
      (function () {
        var DEBUG = /[?&]debug=1/.test(location.search);
        var seen = {};
        function endpoint() {
          var b = (window.__WS_BACKEND__ || "").replace(/^ws/, "http").replace(/\/api\/ws$/, "");
          return b ? b + "/api/clienterror" : "";
        }
        function report(kind, msg, src, line, col, stack) {
          var key = kind + "|" + msg + "|" + line + "|" + col;
          if (seen[key]) return;
          seen[key] = true;
          try {
            var url = endpoint();
            if (url)
              navigator.sendBeacon(
                url,
                JSON.stringify({ kind: kind, msg: String(msg).slice(0, 500), src: src || "", line: line || 0, col: col || 0, stack: String(stack || "").slice(0, 1500), ua: navigator.userAgent, at: Date.now() })
              );
          } catch (e) {}
          if (!DEBUG) return;
          try {
            var box = document.getElementById("__err");
            if (!box) {
              box = document.createElement("div");
              box.id = "__err";
              box.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;max-height:45vh;overflow:auto;background:#2a0008;color:#ffd7d7;font:12px/1.5 monospace;padding:10px 34px 10px 12px;white-space:pre-wrap;border-top:3px solid #ff4d4d";
              var x = document.createElement("button");
              x.textContent = "×";
              x.style.cssText = "position:absolute;top:6px;right:8px;background:none;border:0;color:#ffd7d7;font-size:18px;cursor:pointer";
              x.onclick = function () { box.remove(); };
              box.appendChild(x);
              (document.body || document.documentElement).appendChild(box);
            }
            var l = document.createElement("div");
            l.textContent = "⚠ " + kind + ": " + msg + "  @ " + String(src || "?").split("/").pop() + ":" + line + ":" + col;
            box.appendChild(l);
            if (stack) { var pre = document.createElement("div"); pre.style.opacity = ".7"; pre.textContent = String(stack).slice(0, 600); box.appendChild(pre); }
          } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          if (e && e.error) report("error", e.message, e.filename, e.lineno, e.colno, e.error.stack);
          else if (e && e.message) report("error", e.message, e.filename, e.lineno, e.colno, "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          report("promise", (r && (r.message || r)) || "unhandled rejection", (r && r.fileName) || "", (r && r.lineNumber) || 0, (r && r.columnNumber) || 0, r && r.stack);
        });
      })();
    </script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <!-- Big announcements like "Bust" and "Clean 7" sit outside the app so redraws never cut them off -->
    <div id="announce" aria-hidden="true"></div>
    <noscript>7Bust needs JavaScript enabled.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
