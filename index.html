<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0604" />
    <title>7Bust: hit the felt</title>

    <!-- Fonts are bundled, CrazyGames hosts the files and may block outside requests -->
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <!-- Every platform build uses this same server so all players share one set of rooms -->
    <!-- A room code from one platform works on another. vercel.app and localhost use their own -->
    <script>
      window.__WS_BACKEND__ = "wss://7-bust-cg.vercel.app/api/ws";
    </script>

    <!-- CrazyGames SDK, loaded before the game so it's there at boot -->
    <!-- Its methods throw away from CrazyGames and localhost, so every call is wrapped -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <!-- Big announcements like "Bust" and "Clean 7" sit outside the app so redraws never cut them off -->
    <div id="announce" aria-hidden="true"></div>
    <noscript>7Bust needs JavaScript enabled.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
